# Redis only — the app itself runs with `npm run dev:all` on your machine.
#
# Why not the app too: you edit this code, and a container would mean a rebuild
# per change. Redis is the one dependency you cannot npm install, so that is
# the one thing this file provides.
#
#   docker compose up -d     start
#   docker compose down      stop (data survives — see the volume below)
#   docker compose down -v   stop AND wipe (deletes your saved Facebook tokens)

services:
  redis:
    image: redis:7-alpine
    container_name: fb-media-uploader-redis
    # Bind to localhost only. Without the 127.0.0.1 prefix Docker publishes the
    # port on every interface, putting an unauthenticated Redis — holding your
    # encrypted Facebook tokens — on the office network.
    ports:
      - "127.0.0.1:6379:6379"
    command:
      - redis-server
      # noeviction, NOT the usual allkeys-lru: this holds a job queue and the
      # token store, not a cache. Under memory pressure allkeys-lru would
      # silently delete queued jobs and your saved tokens. BullMQ's own
      # production guide requires noeviction.
      - --maxmemory-policy
      - noeviction
      # appendonly: tokens must survive a restart. Without it a `docker compose
      # restart` loses every token you added and there is no way to get them
      # back.
      - --appendonly
      - "yes"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

volumes:
  redis-data:
